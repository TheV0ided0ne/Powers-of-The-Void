<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>POTV - Origins</title>
	<style>
	html, body {
		background: black;
		color: white;
		margin: 0;
		padding: 0;
		font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	}

	header {
		text-align: center;
		padding: 30px 20px;
		background: linear-gradient(180deg, #181124 0%, #0d0a12 100%);
		border-bottom: 1px solid #321f47;
	}

	h1 {
		margin: 0;
		font-size: 2.5rem;
		letter-spacing: 1px;
		text-shadow: 0 0 10px rgba(147, 51, 234, 0.3);
	}

	.void-text {
		color: purple;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
	}

	.dragonheart-text {
		color: orangered;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(225, 59, 15, 0.8);
	}

	.angelic-text {
		color: white;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
	}

	.demonic-text {
		color: red;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(225, 0, 0, 0.8);
	}

	.nightmare-text {
		color: black;
		font-weight: bold;
	}

	.nature-text {
		color: green;
		font-weight: bold;
		text-shadow: 0 0 15px rgb(0, 255, 0);
	}

	.wiki-container {
		display: flex;
		max-width: 1200px;
		margin: 40px auto;
		background: #130f1c;
		border: 1px solid #2d223c;
		border-radius: 8px;
		overflow: hidden;
		box-shadow: 0 10px 30px rgba(0,0,0,0.5);
	}

	.sidebar {
		display: flex;
		flex-direction: column;
		width: 220px;
		background: #181225;
		border-right: 1px solid #2d223c;
	}

    .sub-tabs {
        display: flex;
        gap: 8px;
        margin: 24px 0 16px;
        flex-wrap: wrap;
    }
    
    .sub-tab-button {
        background: #1a1326;
        color: #9a8fa8;
        border: 1px solid #3b2a54;
        padding: 8px 16px;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .sub-tab-button:hover {
        color: #e0dced;
        border-color: #a855f7;
    }

    .sub-tab-button.active {
        background: #2a1b40;
        color: #c084fc;
        border-color: #a855f7;
    }

    .sub-panel {
        display: none;
    }

    .sub-panel.active {
        display: block;
    }

    .level-table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0 20px;
        font-size: 0.95em;
    }

    .level-table th,
    .level-table td {
        border-bottom: 1px solid #2d223c;
        padding: 8px 10px;
        text-align: left;
    }

    .level-table th {
        color: #c084fc;
    }

    .diff-up { color: #6fcf97; }
    .diff-down {color: #eb5757; }

	.tab-button {
		display: block;
		width: 100%;
		box-sizing: border-box;
		padding: 18px 20px;
		background: none;
		border: none;
		border-bottom: 1px solid #231a33;
		color: #9a8fa8;
		font: inherit;
		font-weight: 600;
		text-align: left;
		cursor: pointer;
		transition: all 0.3s ease;
	}

	.tab-button:hover {
		background: #231a34;
		color: #e0dced;
		padding-left: 25px;
	}

	.tab-button.active {
		background: #2a1b40;
		color: #c084fc;
		border-left: 4px solid #a855f7;
		padding-left: 25px;
	}

	.tab-content {
		display: none;
		flex: 1;
		padding: 40px;
		line-height: 1.6;
	}

	.tab-content.active {
		display: block;
	}

	h2 {
		color: white;
		margin-top: 0;
		border-bottom: 1px solid #3b2a54;
		padding-bottom: 10px;
	}

    .wiki-link {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background: #a855f7;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        transition: background 0.2s;
    }

	</style>
</head>
<body>

    <header>
        <h1>Showcase of the origins!</h1>
    </header>

    <div class="wiki-container">
        <div class="sidebar" id="sidebar"></div>
        <div id="content"></div>
    </div>
    <script>
        // This is where the origin reside in the wiki, just incase if you have collapsed / Compressed the code.
        // (CTRL + SHIFT + [) - You better remember this Vee (from Vee idfk I'm bored)
        const entries = [
            {
                id: 'origins',
                label: 'Origins Overview',
                title: 'Origins Overview',
                html: `
                    <p>The origins will be quick listed here and will go over them all very briefly,
                        more information is on the tabs to the left! This will also contain their biological lore,
                        abilities and playstyles.</p>
                    <p>If needed to, return to the main page!</p>
                    <a class="wiki-link" href="index.html">Return to the main page</a>

                    <div class="sub-tabs">
                        <button class="sub-tab-button active" data-sub="voided-siblings">The Siblings of The Void</button>
                        <button class="sub-tab-button" data-sub="old-legends">The Old Legends</button>
                        <button class="sub-tab-button" data-sub="outlaws">The Outlaws</button>
                    </div>

                    <div class="sub-panel active" data-sub="voided-siblings">
                        <h3>The Siblings of The Void</h3>
                        <p>The Siblings of The Void consist of Veyron Dragonheart, Florian Dragonheart and Shiori Dragonheart. These three are known as the 'Dragonhearts', a family of Deities, Gods and Demi-Gods.
                        But it wasn't always like this. Long ago on Earth, their birth planet, a mysterious portal had opened in front of them and they all went inside, unbeknownst of the horrors that lied ahead.
                        After landing on three different worlds, the siblings were split up. Veyron met an unfortunate fate, getting their leg, arm and eye ripped off their body. Florian and Shiori got happier lives.</p>

                        <p>Florian was met with The Feywilds and was accepted into a clan of Dark Faeries. He trained everyday and was given potions to turn into a Dark Faery, but thanks to his human genes, he was much stronger than a typical Dark Faery, 
                        allowing himself to become the strongest in his clan. But now after years, he had to find his long lost brother and sister.</p>
                        
                        <p>Shiori was not met with a happy life immediately, she was captured and used in a ritual to be sacraficed, but a demon whom was an angel in disguise was able to kill the demons and rescue her, but in the process Shiori had turned into an Angelic-Demon Hybrid.
                            After the incident, Shiori was brought to The Heavens and was nursed to health. Eventually, the angel whom had saved her trained her hard enough to become the guardian of The Heavens.</p>
                    
                        <p>But what is left? Veyron is dead, Florian and Shiori look for the dead...</p>
                    </div>

                    <div class="sub-panel" data-sub="old-legends">
                        <h3>The Old Legends</h3>
                        <p>The Old Legends were known as heroes in the past, now they torment those who are within their presence, but the only one who did not succumb to the darkness was The Deity of Nature, the last Deity in existance.</p>
                        <p>The Deity of Nature, the known primordial deity to ever exist, was one of the old legends whom was able to create natural essence at will, just like a Voidwalker.
                        Throughout their life, they had been a hero throughout the ages, but when the other heroes had succumbed to the darkness, specifically Catastrophe and Zealot, both of them had
                        proceeded to injure the deity and kill all the old legends, just before going towards the edge of the multiverse and creating the nightmare strain to kill the Voidwalkers, only to succeed.</p>
                        <p>Catastrophe, The Living Nightmare Strain, the reason of the death of the voidwalker race. He was the reason of the Nightmare Strain being created and was able to nearly kill Void, out of everyone, it was Catastrophe that nearly brought Void to death
                        and was even able to kill him once in the past. But not long after Void's death, void returned from the dead and proceeded to pay back the favor and nearly killed Catastrophe, not before being sent back into The Void by Zealot.</p>
                        <p>Zealot, One of the last Lightwalkers in existence. Zealot was the entire reason Void had lost his right leg, arm and eye, being one of the reasons that Void wasn't able to kill all the corrupted legends and the others led by Catastrophe.
                        Zealot was born on the universal opposite of Syct' Vein also known as Lux Nexus, he had a rough childhood and eventually met Catastrophe, whom manipulated Zealot into joining him, killing his entire race and caused him to help with creating the Nightmare Strain,
                        only which after all of that, in the time that they were invading Syct' Vein and were killing the Voidwalkers race, he finally met Void and killed him for the first time, causing Void to transform into a Vampiric Voidwalker after being saved by Varelt.</p>
                    </div>

                    <div class="sub-panel" data-sub="outlaws">
                        <h3>The Outlaws</h3>
                        <p>The Outlaws, the faction whose leader died and Void decided to lead them instead to show that they are not alone.</p>
                        <p>This faction consisted of many members, being Robert, Siphon, Benjamin Saiph, Glitch and Varelt. They were led by Varelt after their original leader died, then Void took command and helped them recoup what they had lost.
                        Varelt and Void had already met, and they had already been dating for many years. After becoming the leader, he married her and continued to help the outlaws.</p>
                        <p>Void was their leader, Varelt was the second in command, Siphon was in charge of defense calibrations, Robert was in charge of the arsenals, Benjamin Saiph was in charge of scouting, and Glitch was in charge of making sure their signals were not exposed to outside sources.
                    </div>
                `
            },
            {
                id: 'void',
                label: 'Void',
                title: 'Void',
                html: `
                    <p>Void also known as Void Ashe Vale is an unknown entity that appeared when Florian Dragonheart and Shiori Dragonheart started looking for their long lost brother 'Veyron', saying that he would help them find him, as long as they help him find who he once was in the past.
                        he is the most brutal of The Outlaws, capable of destroying entire worlds if he needs to, but despite his terrifying power he is a kind soul 
                        and will protect his family and friends against the strongest of foes.
                    
                    <div class="sub-tabs">
                        <button class="sub-tab-button active" data-sub="resources">Resources</button>
                        <button class="sub-tab-button" data-sub="passives">Passives</button>
                        <button class="sub-tab-button" data-sub="abilities">Abilities</button>
                        <button class="sub-tab-button" data-sub="lore">Lore</button>
                        <button class="sub-tab-button" data-sub="voicelines">Voicelines</button>
                    </div>
                    
                    <div class="sub-panel active" data-sub="resources">

                        <h3>Void Essence</h3>
                        <p>Void Essence is a resource that can be regenerated by consuming blocks infused with The Void, such as amethyst and obsidian. You can also be nearby these blocks and regenerate too!</p>
                        <table class="level-table"
                            <tr><th>Level</th><th>Capacity</th></tr>
                            <tr><td>1</td><td>100</td></tr>
                            <tr><td>2</span></td><td>200 <span class="diff-up">(+100)</td></tr>
                            <tr><td>3</span></td><td>300 <span class="diff-up">(+100)</td></tr>
                            <tr><td>4</span></td><td>400 <span class="diff-up">(+100)</td></tr>
                            <tr><td>Ascension</span></td><td>500 <span class="diff-up">(+100)</td></tr>
                        </table>

                        <h3>Blood</h3>
                        <p>Blood is a resource that can be regenerated by killing enemies, even if they have no blood... for some reason- But despite that obvious logic flaw, you can use blood to pull yourself into a frenzy and use some abilities!</p>
                        <table class="level-table"
                            <tr><th>Level</th><th>Capacity</th></tr>
                            <tr><td>1</td><td>100</td></tr>
                            <tr><td>3</td><td>175 <span class="diff-up">(+75)</td></tr>
                            <tr><td>Ascension</td><td>250 <span class="diff-up">(+75)</td></tr>
                        </table>

                        <h3>Decay</h3>
                        <p>Decay is a negative resource that grows overtime by using abilities. You can only lower this decay by not using abilities for a certain time period, otherwise you slowly decay and begin to die. 
                            The only exception is using Vampiric Rage and killing enemies to quench your decays thirst. Overtime whilst the decay increases, you begin getting weaker and weaker, becoming slower, doing less damage 
                            and lose your armor points overtime, meaning at lower levels this matters a lot as you can go into negative armor meaning you take more damage than normal!</p>
                        <p>&bull; This resource does not increase over levels
                        <p>&bull; The weakening threshold goes as shown:
                        <p>50 Decay: Weakness 1, slowness 1 and <span style="color: red;">-4</span> armor points.
                        <p>100 Decay: Weakness 2, slowness 2, <span style="color: red;">-8</span> armor points and <span style="color: red;">1 damage per second</span> and only resetting on <span style="color: red;">death</span> if not fixed in time.
                        <table class="level-table"
                            <tr><th>Level</th><th>Capacity</th></tr>
                            <tr><td>1</td><td>100</td></tr>
                        </table>
                    </div>
             
                    <div class="sub-panel" data-sub="passives">
                        <h3><span style="color: green;">Darkness Incarnate - Positive</span></h3>
                        <p>Whilst within the darkness, you begin to ease your decaying body and start to adapt to it, gaining night vision, becoming faster with speed and haste, and also healing upon kills whilst inside of this state.</p>
                        <h3><span style="color: green;">Fire Within - Positive</span></h3>
                        <p>Due to your immense healing factor and Voidwalker body, you can withstand any basic fire and can withstand lava for a short time, eventually taking damage from lava after 10 seconds.</p>
                        <h3><span style="color: orange;">Forced Regeneration - Neutral</span></h3>
                        <p>Consume Void Essence over time to heal yourself, you cannot toggle this and this could be bad for you in some situations but overall is quite useful when you have a plentiful resource!</p>
                        <h3><span style="color: orange;">Undead - Neutral</span></h3>
                        <p>Due to your undead nature of being part vampiric, you have all the debuffs of an undead mob except for burning in the daylight but also all the positives. You take more damage from Smite enchantments but can breathe underwater and cannot suffocate.</p>
                        <h3><span style="color: red;">Heavy Armor - Negative</span></h3>
                        <p>Despite you being undead and able to breathe underwater, you cannot move as efficiently in the water and rain due to your heavy armor, granting you slowness whenever it is raining or you are submerged in the water.</p>
                        <h3><span style="color: red;">Abomination - Negative</span></h3>
                        <p>Due to what you are, you slowly decay over time when using abilities, you can also not use anything relating to silver otherwise your decay grows immensely!</p>
                    </div>

                    <div class="sub-panel" data-sub="abilities">
                        <h3>Rift Slash</h3>
                        <p>Slash a rift within the Void with your extremely sharp void claws or instantly teleport yourself. You can either charge this ability and teleport over 200 blocks away, or teleport over 30 blocks instantly.</p>
                        <p>(This ability does not become stronger over levels)</p>
                        <table class="level-table">
                            <tr><th>Level</th><th>Short Distance</th><th>Long Distance</th><th>Cooldown</th></tr>
                            <tr><td>1</td><td>30</td><td>200</td><td>2s Short | 6s Long</td></tr>
                        </table>
                        <h3>Vampiric Rage</h3>
                        <p>Become enraged via the smell of your own blood. Slash yourself and deal over 5 hearts of damage to yourself yet gain temporary haste, strength, resistance and speed, all at level 1 scaling to level 3 depending on level.</p>
                        <table class="level-table">
                            <tr><th>Level</th><th>Haste</th><th>Strength</th><th>Resistance</th><th>Speed</th></tr>
                            <tr><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr>
                            <tr><td>2</td><td>2 <span class="diff-up">(+1)</span></td><td>2 <span class="diff-up">(+1)</span></td><td>2 <span class="diff-up">(+1)</span></td><td>2 <span class="diff-up">(+1)</td></tr>
                            <tr><td>3</td><td>3 <span class="diff-up">(+1)</span></td><td>3 <span class="diff-up">(+1)</span></td><td>3 <span class="diff-up">(+1)</span></td><td>3 <span class="diff-up">(+1)</td></tr>
                        </table>
                        <p>| Level 3: Base Unlock | Max Level: Lv 2 Effects | Ascension : lv 3 Effects |</p>
                        <p>&bull; A True Catastrophe | Ascension and Advancement 10 Unlock |</p>
                    </div>

                    <div class="sub-panel" data-sub="lore">
                        <h3>The origins of The Voided One</h3>
                        <p>Void is the most mysterious member of The Outlaws, being someone primarily made of Void Essence and blood. No organs, no need for eating, just veins, blood and essence.
                        <p>He first appeared when the Siblings of The Void started to look for their long lost brother 'Veyron' whom had scattered from them long ago. Afraid of their death, they turned to Void once he appeared near them to help them, 
                            and all he asked for was one favor..."Help me find who I once was, and perhaps I can help you. Understood?" They reluctantly agreed and were sceptical of who he was, but he assured them that he was not Veyron after showing them his face.
                            Worn-torn, scarred and missing an eye... but the thought was quickly dismissed from the words; "So who are you two? What are your names?".</p>
                        <p>And now they look onwards to find their lost brother</p>
                        <p>It was time to search for the long lost world of The Voidwalkers.</p>
                        </div>

                    <div class="sub-panel" data-sub="voicelines">
                        <h3>Void's Voicelines</h3>
                        <p>Make sure your browser supports mp3 mpeg audios so that you can listen to the lines!</p>
                        <dl>
                            <dt><strong>Origin Chosen / Respawn</strong></dt>
                            <dd>
                                <p class="void-text">"What a horrid world."</p>
                                <audio controls>
                                    <source src="audio/void-placeholder.mp3" type="audio/mpeg">
                                    </audio>
                                    </dd>

                            <dt><strong>Level 2</strong></dt>
                            <dd>
                                <p class="void-text">"About damn fucking time!"</p>
                                <audio controls>
                                    <source src="audio/void-placeholder.mp3" type="audio/mpeg">
                                    </audio>
                                    </dd>
                        </div>
                    `
            },
            {
                id: 'florian',
                label: 'Florian Dragonheart',
                title: 'Florian Dragonheart',
                html: `
                    <p>Florian Dragonheart is the brother of Veyron Dragonheart and Shiori Dragonheart. He is the middle child and aged up to being the eldest after landing in the Faewilds. 
                        He is known for his fast flurry of attacks and aggressive fighting style.</p>
                `
            },
            {
              id: 'shiori',
              label: 'Shiori Dragonheart',
              title: 'Shiori Dragonheart',
              html: `
                  <p>Shiori Dragonheart is the sister of Veyron Dragonheart and Florian Dragonheart. She is the youngest out of the siblings remaining as a 22 year old demonic-angel.  
                    She is known for her careful playstyle delivering fast attacks that remain extremely powerful but she does remain a glass cannon.</p>
              `
            }
        ];

        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');

        function showEntry(id) {
            document.querySelectorAll('.tab-button').forEach(b =>
                b.classList.toggle('active', b.dataset.id === id));
            document.querySelectorAll('.tab-content').forEach(p =>
                p.classList.toggle('active', p.dataset.id === id));
        }

        entries.forEach((entry) => {
            const btn = document.createElement('button');
            btn.className = 'tab-button';
            btn.textContent = entry.label;
            btn.dataset.id = entry.id;
            btn.addEventListener('click', () => showEntry(entry.id));
            sidebar.appendChild(btn);

            const panel = document.createElement('div');
            panel.className = 'tab-content';
            panel.dataset.id = entry.id;
            panel.innerHTML = `<h2>${entry.title}</h2>${entry.html}`;
            content.appendChild(panel);
        });

        if (entries.length) showEntry(entries[0].id);

        const categories = [
            { cls: 'void-text',        words: ['Veyron', 'Void', 'Voidwalker', 'Void Essence', 'The Voided One'] },
            { cls: 'dragonheart-text', words: ['Dragonheart', 'Florian', 'Wrath', 'wrath'] },
            { cls: 'angelic-text',     words: ['Shiori', 'Angel', 'Heaven', 'Heavens', 'heavens', 'angel'] },
            { cls: 'demonic-text',     words: ['Varelt', 'Vale', 'Blood', 'Unholy', 'unholy', 'blood', 'Ashe', 'Demon', 'Demonic', 'demonic'] },
            { cls: 'nightmare-text',   words: ['Nightmare', 'nightmare', 'Catastrophe', 'catastrophe', 'Benjamin Saiph', 'Decay', 'decay'] },
            { cls: 'nature-text',      words: ['Deity of Nature', 'Nature', 'Natures', 'Siphon'] }
        ];

        content.addEventListener('click', e => {
            const btn = e.target.closest('.sub-tab-button');
            if (!btn) return;

            const page = btn.closest('.tab-content');
            const target = btn.dataset.sub;

            page.querySelectorAll('.sub-tab-button').forEach(b =>
                b.classList.toggle('active', b === btn));
            page.querySelectorAll('.sub-panel').forEach(p => 
                p.classList.toggle('active', p.dataset.sub === target));
        });

        const lookup = new Map();
        categories.forEach(c => c.words.forEach(w => lookup.set(w, c.cls)));

        const escapeRegex = s => s.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const words = [...lookup.keys()]
            .sort((a, b) => b.length - a.length)
            .map(escapeRegex);
        const wordRegex = new RegExp(`\\b(${words.join('|')})\\b`, 'g');

        document.querySelectorAll('#sidebar, #content').forEach(root => {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);

            textNodes.forEach(node => {
                const parts = node.nodeValue.split(wordRegex);
                if (parts.length === 1) return;

                const frag = document.createDocumentFragment();
                parts.forEach((part, i) => {
                    if (!part) return;
                    if (i % 2 === 1) {
                        const span = document.createElement('span');
                        span.className = lookup.get(part);
                        span.textContent = part;
                        frag.appendChild(span);
                    } else {
                        frag.appendChild(document.createTextNode(part));
                    }
                });
                node.replaceWith(frag);
            });
        });
    </script>
</body>
</html>
