<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>POTV - Origins</title>
	<style>
	html, body {
		background: black;
		color: white;
		margin: 0;
		padding: 0;
		font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	}

	header {
		text-align: center;
		padding: 30px 20px;
		background: linear-gradient(180deg, #181124 0%, #0d0a12 100%);
		border-bottom: 1px solid #321f47;
	}

	h1 {
		margin: 0;
		font-size: 2.5rem;
		letter-spacing: 1px;
		text-shadow: 0 0 10px rgba(147, 51, 234, 0.3);
	}

	.void-text {
		color: purple;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
	}

	.dragonheart-text {
		color: orangered;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(225, 59, 15, 0.8);
	}

	.angelic-text {
		color: white;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
	}

	.vampiric-text {
		color: red;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(225, 0, 0, 0.8);
	}

	.nightmare-text {
		color: black;
		font-weight: bold;
		text-shadow: 0 0 15px rgb(0, 0, 0);
	}

	.nature-text {
		color: green;
		font-weight: bold;
		text-shadow: 0 0 15px rgb(0, 255, 0);
	}

	.wiki-container {
		display: flex;
		max-width: 1200px;
		margin: 40px auto;
		background: #130f1c;
		border: 1px solid #2d223c;
		border-radius: 8px;
		overflow: hidden;
		box-shadow: 0 10px 30px rgba(0,0,0,0.5);
	}

	.sidebar {
		display: flex;
		flex-direction: column;
		width: 220px;
		background: #181225;
		border-right: 1px solid #2d223c;
	}

	.tab-button {
		display: block;
		width: 100%;
		box-sizing: border-box;
		padding: 18px 20px;
		background: none;
		border: none;
		border-bottom: 1px solid #231a33;
		color: #9a8fa8;
		font: inherit;
		font-weight: 600;
		text-align: left;
		cursor: pointer;
		transition: all 0.3s ease;
	}

	.tab-button:hover {
		background: #231a34;
		color: #e0dced;
		padding-left: 25px;
	}

	.tab-button.active {
		background: #2a1b40;
		color: #c084fc;
		border-left: 4px solid #a855f7;
		padding-left: 25px;
	}

	.tab-content {
		display: none;
		flex: 1;
		padding: 40px;
		line-height: 1.6;
	}

	.tab-content.active {
		display: block;
	}

	h2 {
		color: white;
		margin-top: 0;
		border-bottom: 1px solid #3b2a54;
		padding-bottom: 10px;
	}
	</style>
</head>
<body>

    <header>
        <h1>Showcase of the origins!</h1>
    </header>

    <div class="wiki-container">
        <div class="sidebar" id="sidebar"></div>
        <div id="content"></div>
    </div>

    <script>
        const entries = [
            {
                id: 'origins',
                label: 'Origins Overview',
                title: 'Origins Overview',
                html: `
                    <p>The origins will be quick listed here and will go over them all very briefly,
                        more information is on the tabs to the left! This will also contain their biological lore,
                        abilities and playstyles.</p>

                    <h3>The Siblings of The Void</h3>

                    <p>The Siblings of The Void refers to Veyron, Florian and Shiori. Three siblings that were taken away from their home planet 'Earth'
                        and were forced to be victims of the multiverse.</p>
                    <p>Veyron, The Voidwalker, he was forced to be torn limb from limb even losing his eye, that includes his right leg and arm.
                        He was imbued with the powers of The Void and was able to conjure Void Essence that was able to destroy entire worlds to his pleasure,
                        but he only had the desire of good within his heart, despite his mistakes he would make in the future and the carnage he would unleash upon the world. But despite that all, he is of purest intent.</p>
                    <p>Florian Dragonheart, The Sin of Wrath, he was forced to adapt to his new life as a fae and eventually learned magic within his school. Eventually he met his wife, Kamila, who eventually birthed his child, Silas, after he had turned 240
                        Despite his need to adapt and his great life, he was not safe for long as a call had echoed out from The Void, his brother, Veyron Dragonheart, was soon to return to his side.</p>
                    <p>Shiori Dragonheart, The Guardian of The Heavens, she was forced to carry her life as an outcast and was eventually captured by demons, only to be nearly sacrificed by them all and saved by an angel, but it was too late.
                        She had become part demon, and part angel thanks to the angel who saved her. The angel carried her to the heavens as she was weak from the ritual and was brought back to health in the heavens.
                        After some time, and spending years in the heavens, she finally had rose up the ranks to become the Guardian of The Heavens to guard her fellow citizens!</p>

                    <h3>The Old Legends</h3>

                    <p>The Old Legends were known as heroes in the past, now they torment those who are within their presence, but the only one who did not succumb to the darkness was The Deity of Nature, the last Deity in existance.</p>
                    <p>The Deity of Nature, the known primordial deity to ever exist, was one of the old legends whom was able to create natural essence at will, just like a Voidwalker.
                        Throughout their life, they had been a hero throughout the ages, but when the other heroes had succumbed to the darkness, specifically Catastrophe and Zealot, both of them had
                        proceeded to injure the deity and kill all the old legends, just before going towards the edge of the multiverse and creating the nightmare strain to kill the Voidwalkers, only to succeed.</p>
                    <p>Catastrophe, The Living Nightmare Strain, the reason of the death of the voidwalker race. He was the reason of the Nightmare Strain being created and was able to nearly kill Void, out of everyone, it was Catastrophe that nearly brought Void to death
                        and was even able to kill him once in the past. But not long after Void's death, void returned from the dead and proceeded to pay back the favor and nearly killed Catastrophe, not before being sent back into The Void by Zealot.</p>
                    <p>Zealot, One of the last Lightwalkers in existence. Zealot was the entire reason Void had lost his right leg, arm and eye, being one of the reasons that Void wasn't able to kill all the corrupted legends and the others led by Catastrophe.
                        Zealot was born on the universal opposite of Syct' Vein also known as Lux Nexus, he had a rough childhood and eventually met Catastrophe, whom manipulated Zealot into joining him, killing his entire race and caused him to help with creating the Nightmare Strain,
                        only which after all of that, in the time that they were invading Syct' Vein and were killing the Voidwalkers race, he finally met Void and killed him for the first time, causing Void to transform into a Vampiric Voidwalker after being saved by Varelt.</p>

                    <h3>The Outlaws</h3>
                    <p>The Outlaws, the faction whose leader died and Void decided to lead them instead to show that they are not alone.</p>
                    <p>This faction consisted of many members, being Robert, Siphon, Benjamin Saiph, Glitch and Varelt.</p>
                `
            },
            {
                id: 'void',
                label: 'Veyron Ashe Vale',
                title: 'Veyron Ashe Vale (Void)',
                html: `
                    <p>Veyron Ashe Vale also known as Void or Veyron Dragonheart -- is a sibling and original eldest of the Dragonhearts. He was known for his intense smarts and being the smartest within his family.</p>
                    <p>After landing in Syct' Vein, he died due to Zealot and Catastrophe and had lost his arm, leg and right eye. But this did not stop him as he continued onwards for revenge and balance of this world!</p>
                `
            },
            {
                id: 'florian',
                label: 'Florian Dragonheart',
                title: 'Florian Dragonheart',
                html: `
                    <p>Florian Dragonheart is the brother of Veyron Ashe Vale and Shiori Dragonheart, he is known for his fast flurry of attacks and aggressive fighting style.</p>
                `
            },
            {
              id: 'shiori',
              label: 'Shiori Dragonheart',
              title: 'Shiori Dragonheart',
              html: `
                  <p>Shiori Dragonheart is the sister of Veyron Ashe Vale and Florian Dragonheart, she is known for her careful playstyle delivering fast attacks that remain extremely powerful but she does remain a glass cannon.</p>
              `
            }
        ];

        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');

        function showEntry(id) {
            document.querySelectorAll('.tab-button').forEach(b =>
                b.classList.toggle('active', b.dataset.id === id));
            document.querySelectorAll('.tab-content').forEach(p =>
                p.classList.toggle('active', p.dataset.id === id));
        }

        entries.forEach((entry) => {
            const btn = document.createElement('button');
            btn.className = 'tab-button';
            btn.textContent = entry.label;
            btn.dataset.id = entry.id;
            btn.addEventListener('click', () => showEntry(entry.id));
            sidebar.appendChild(btn);

            const panel = document.createElement('div');
            panel.className = 'tab-content';
            panel.dataset.id = entry.id;
            panel.innerHTML = `<h2>${entry.title}</h2>${entry.html}`;
            content.appendChild(panel);
        });

        if (entries.length) showEntry(entries[0].id);

        const categories = [
            { cls: 'void-text',        words: ['Veyron', 'Void', 'Voidwalker'] },
            { cls: 'dragonheart-text', words: ['Dragonheart', 'Florian', 'Wrath', 'wrath'] },
            { cls: 'angelic-text',     words: ['Shiori', 'Angel', 'Heaven', 'Heavens', 'heavens', 'angel'] },
            { cls: 'vampiric-text',    words: ['Varelt', 'Ashe Vale', 'Blood', 'Unholy', 'unholy', 'blood'] },
            { cls: 'nightmare-text',   words: ['Nightmare', 'nightmare', 'Catastrophe', 'catastrophe', 'Benjamin Saiph'] },
            { cls: 'nature-text',      words: ['Deity of Nature', 'Nature', 'Natures', 'Siphon'] }
        ];

        const lookup = new Map();
        categories.forEach(c => c.words.forEach(w => lookup.set(w, c.cls)));

        const escapeRegex = s => s.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const words = [...lookup.keys()]
            .sort((a, b) => b.length - a.length)
            .map(escapeRegex);
        const wordRegex = new RegExp(`\\b(${words.join('|')})\\b`, 'g');

        document.querySelectorAll('#sidebar, #content').forEach(root => {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);

            textNodes.forEach(node => {
                const parts = node.nodeValue.split(wordRegex);
                if (parts.length === 1) return;

                const frag = document.createDocumentFragment();
                parts.forEach((part, i) => {
                    if (!part) return;
                    if (i % 2 === 1) {
                        const span = document.createElement('span');
                        span.className = lookup.get(part);
                        span.textContent = part;
                        frag.appendChild(span);
                    } else {
                        frag.appendChild(document.createTextNode(part));
                    }
                });
                node.replaceWith(frag);
            });
        });
    </script>

</body>
</html>
