<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powers of The Void</title>
    <style>
        	html, body {
		background: black;
		color: white;
		margin: 0;
		padding: 0;
		font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	}

	header {
		text-align: center;
		padding: 30px 20px;
		background: linear-gradient(180deg, #181124 0%, #0d0a12 100%);
		border-bottom: 1px solid #321f47;
	}

	h1 {
		margin: 0;
		font-size: 2.5rem;
		letter-spacing: 1px;
		text-shadow: 0 0 10px rgba(147, 51, 234, 0.3);
	}

	.void-text {
		color: purple;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
	}

	.dragonheart-text {
		color: orangered;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(225, 59, 15, 0.8);
	}

	.angelic-text {
		color: white;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
	}

	.demonic-text {
		color: red;
		font-weight: bold;
		text-shadow: 0 0 15px rgba(225, 0, 0, 0.8);
	}

    .nightmare-text {
        color: black;
        font-weight: bold;
        text-shadow: 0 0 6px rgba(168, 85, 247, 0.5);
    }

	.nature-text {
		color: green;
		font-weight: bold;
		text-shadow: 0 0 15px rgb(0, 255, 0);
	}

	.wiki-container {
		display: flex;
		max-width: 1200px;
		margin: 40px auto;
		background: #130f1c;
		border: 1px solid #2d223c;
		border-radius: 8px;
		overflow: hidden;
		box-shadow: 0 10px 30px rgba(0,0,0,0.5);
	}

	.sidebar {
		display: flex;
		flex-direction: column;
		width: 220px;
		background: #181225;
		border-right: 1px solid #2d223c;
	}

    .sub-tabs {
        display: flex;
        gap: 8px;
        margin: 24px 0 16px;
        flex-wrap: wrap;
    }
    
    .sub-tab-button {
        background: #1a1326;
        color: #9a8fa8;
        border: 1px solid #3b2a54;
        padding: 8px 16px;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .sub-tab-button:hover {
        color: #e0dced;
        border-color: #a855f7;
    }

    .sub-tab-button.active {
        background: #2a1b40;
        color: #c084fc;
        border-color: #a855f7;
    }

    .sub-panel {
        display: none;
    }

    .sub-panel.active {
        display: block;
    }

    .level-table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0 20px;
        font-size: 0.95em;
    }

    .level-table th,
    .level-table td {
        border-bottom: 1px solid #2d223c;
        padding: 8px 10px;
        text-align: left;
    }

    .level-table th {
        color: #c084fc;
    }

    .diff-up { color: #6fcf97; }
    .diff-down {color: #eb5757; }

	.tab-button {
		display: block;
		width: 100%;
		box-sizing: border-box;
		padding: 18px 20px;
		background: none;
		border: none;
		border-bottom: 1px solid #231a33;
		color: #9a8fa8;
		font: inherit;
		font-weight: 600;
		text-align: left;
		cursor: pointer;
		transition: all 0.3s ease;
	}

	.tab-button:hover {
		background: #231a34;
		color: #e0dced;
		padding-left: 25px;
	}

	.tab-button.active {
		background: #2a1b40;
		color: #c084fc;
		border-left: 4px solid #a855f7;
		padding-left: 25px;
	}

	.tab-content {
		display: none;
		flex: 1;
		padding: 40px;
		line-height: 1.6;
	}

	.tab-content.active {
		display: block;
	}

	h2 {
		color: white;
		margin-top: 0;
		border-bottom: 1px solid #3b2a54;
		padding-bottom: 10px;
	}

    .wiki-link {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background: #a855f7;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        transition: background 0.2s;
    }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to the wiki of <span class="void-text">Powers of The Void!</span></h1>
    </header>

    <div class="wiki-container">
        <div class="sidebar" id="sidebar"></div>
        <div id="content"></div>
    </div>
    <script>
        // This is where the intro wiki resides.
        const entries =[
            {
                id: 'introduction',
                label: 'Wiki Introduction',
                title: 'Wiki Introduction',
                html: `
                    <p>This project is a massive origins project and mod containing over 14 origins. It features insane origins all built with multiple systems created to completely transform your gameplay loop!</p>
                    <p>This wiki will contain advancements, a leveling system and ascension system!</p>
                    <img class="origin-preview-img" src="./Images/Origins.jpeg" width="100" height="100" alt="Origins Orb">
                    <p>Ready to look into the origings and learn all the lore? All the custom entries reside right here and will explore on the origin lore, abilities, resources, passives and more!:</p>
                    <a class="wiki-link" href="origins.html">Explore Origins Wiki</a>
                  `
                },
            {
                id: 'origins',
                label: 'The Origins',
                title: 'The Origins',
                html: `
                    <h3>This will contain all the lore of the origins and how they came to be inside of this mysterious..'Minecraft' world.</h3>

                    <div class="sub-tabs">
                        <button class="sub-tab-button active" data-sub="siblings">The Siblings of The Void</button>
                        <button class="sub-tab-button" data-sub="outlaws">The Outlaws</button>
                        <button class="sub-tab-button" data-sub="old-legends">The Old Legends</button>
                        </div>

                    <div class="sub-panel active" data-sub="siblings">
                            <h2>The Siblings of The Void</h2>
                            <p>The Siblings of The Void are constructs of the omniverse that were not meant to obtain these immense powers.
                                They have more strength with these powers as they tie into their identity. 
                                Florian being obssessed with punishing those who oppose and hurt his friends and family, and Shiori being a kind hearted woman who loves the skies and shows immense determination.
                                And nothing is known about Veyron Dragonheart.</p>
                        
                        <div class="sub-tabs">
                            <button class="sub-tab-button active" data-sub="veyron">Veyron Dragonheart</button>
                            <button class="sub-tab-button" data-sub="florian">Florian Dragonheart</button>
                            <button class="sub-tab-button" data-sub="shiori">Shiori Dragonheart</button>
                            </div>

                            <div class="sub-panel active" data-sub="veyron">
                                <h2>Veyron Dragonheart</h2>
                                <p>Nothing is known about Veyron Dragonheart anymore, he is not a playable origin technically, but it's nice to list him here for lore reasons.</p>
                                </div>

                            <div class="sub-panel" data-sub="florian">
                                <h2>Florian Dragonheart - The Sin of Wrath</h2>
                                <p>The Sin of Wrath, a being of flames, destruction and one to make a good deal. Brother of Veyron Dragonheart and Shiori Dragonheart.</p>
                                <p>His playstyle revolves around being in front of an enemy's face and delivering fast strikes that all do major damage, slowly charging up his rage to conjure more powerful abilities.</p>
                                </div>

                            <div class="sub-panel" data-sub="shiori">
                                <h2>Shiori Dragonheart - The Guardian of The Heavens</h2>
                                <p>An angel of light and secretly part demonic. She is the sister of Veyron Dragonheart and Florian Dragonheart.</p>
                                <p>Her playstyle revolves around heavy hits over short spans of time and taking the rest to focus on dodging and flying around the battlefield with her angelic wings, 
                                using the essence of The Heavens to cast her enemies to the light.</p>
                                </div>
                        </div>

                    <div class="sub-panel" data-sub="outlaws">
                        <h2>The Outlaws</h2>
                        <p>A faction away from Catastrophe's control, they disobey his laws and kill anyone who opposes them for the greater good.
                            All they wish is to be free from his control of the outside world, and see the land once more, led by the vengeful scientist Nightwalker, ??? (Void) Ashe Vale

                            <div class="sub-tabs">
                                <button class="sub-tab-button active" data-sub="varelt">Varelt Ashe Vale</button>
                                <button class="sub-tab-button" data-sub="violet">Violet Ashe Vale</button>
                                <button class="sub-tab-button" data-sub="benjamin-saiph">Benjamin Saiph</button>
                                <button class="sub-tab-button" data-sub="siphon">Siphon</button>
                                <button class="sub-tab-button" data-sub="robert">Robert</button>
                                <button class="sub-tab-button" data-sub="irina">Irina Dragonheart</button>
                                <button class="sub-tab-button" data-sub="twins">The Twins</button>
                                <button class="sub-tab-button" data-sub="snow">Snow</button>
                                <button class="sub-tab-button" data-sub="lily">Lily</button>
                                </div>

                                

                                <div class="sub-panel active" data-sub="varelt">
                                    <h2>Varelt Ashe Vale - The Goddess of Death</h2>
                                    <p>Varelt Ashe Vale is second in command and the past leader of The Outlaws, being taken over by Veyron.
                                        She is the wife of Void and the last name 'Ashe Vale' is from her bloodline of Vampires.

                                    <p>Her playstyle compliments a player using Void, as she can buff nearby players with the vampiric tag from POTV 
                                        and also creates a temporary bleed effect on enemies that makes vampires siphon blood on hit.</p>
                                    <p>Alone she is proficient in scythes, just like Void, giving +4 damage with scythes and prohibiting shields in her hands.</p>
                                    </div>

                                <div class="sub-panel" data-sub="violet">
                                    <h2>Violet Ashe Vale - The Heir to the Death and Void Gods</h2>
                                    <p>Violet Ashe Vale is the daughter of Varelt and Void, giving her the powers of everything they have, such as vampirism, void and nightmares.
                                    <p>Her playstyle is very similar to Florian, her uncle. She is a fast fighter making sure the pace is never lost, and only staying back when healing is needed.</p>
                                    <p>Violet is a bit weaker than Varelt and Void, so she is proficient in sickles, still carrying on the theme of death and giving +4 damage to sickles.
                                    </div>

                                <div class="sub-panel" data-sub="benjamin-saiph">
                                    <h2>Benjamin Saiph</h2>
                                    <p>A formal killer, a construct of nightmares and Void Essence. Evil made into truth to help The Outlaws in their quest to kill Catastrophe. 
                                        Benamin Saiph was created by Catastrophe, made to kill Veyron. But Veyron was one step ahead and knew what was happening, was able to capture him and convert him 
                                        using Void Essence, letting Benjamin Saiph become a construct of Nightmares and Void Essence.</p>
                                    <p>His playstyle revolves around status effects, applying void-touched, nightmares and bleeding -- Which can also help any vampiric players.</p>
                                    <p>Alone, he is proficient in blades. "A simple weapon is all I desire. Nothing too much, just enough to complete the job." +4 damage to all swords, retains shield usages.</p>
                                    </div>

                                <div class="sub-panel" data-sub="siphon">
                                    <h2>Siphon - The Deity's Blessed</h2>
                                    <p>Siphon is a person blessed with The Deity of Nature's power, allowing her to call upon the deity and use their powers. She originally met Veyron in the fight that shattered the original 
                                        Outlaws, and she is thankful he was there that day, as without him?.. Who knows if they would have won against Zealot.</p>
                                    <p>Her playstyle revolves around mainly her abilities and daggers, she can use any weapon very well but primarily daggers. She can buff her own weapons to apply effects with anything, proving 
                                        to be a very useful asset during a fight.</p>
                                    <p>As stated, she is proficient in daggers, allowing her to have +4 damage, but retains shield usages.</p>
                                    </div>

                                <div class="sub-panel" data-sub="robert">
                                    <h2>Robert - The Weaponsmith</h2>
                                    <p>Ever since he fell into this new land, he could not find an ounce of material worthy enough to make a gun, so he turned to bladesmithing instead.</p>
                                    <p>His playstyle revolves around using his surroundings and extraordinary strength to pummel his enemies to death. Using his abilities he gains the ability to stun enemies and slow them down for a short time.</p>
                                    <p>Due to him being a creator of his own weapons, he knows them best and has the best buff in the mod being +6.5 damage to every weapon in the modpack, and also giving himself +1 armor vest (2 points).</p>
                                    <p>This was also to balance him as he is just a normal human, we needed to balance him out somehow so he gets the biggest buff out of everyone.</p>
                                    </div>

                                <div class="sub-panel" data-sub="irina">
                                    <h2>Irina Dragonheart - A healer at heart</h2>
                                    <p>Not much is known about Irina, only Florian knows much about her as they are husband and wife. Irina is a kind soul who can heal her allies nearby.</p>
                                    <p>Her playstyle revolves around buffing allies and healing them too. By herself she can still fight very well, able to buff and heal herself too and has a powerset very 
                                        similar to Florian.</p>
                                    <p>Like Florian, she is proficient in any type of long weapon, excluding scythes.</p>
                                    </div>

                                <div class="sub-panel" data-sub="twins">
                                    <h2>The Twins - The Son and Daughter of Flames</h2>
                                    <p>Silas and Kamila are the son and daughter of Florian and Irina, they posses the powers of both of their parents and are capable of igniting flames out of thin air just like Florian, 
                                        but they are primarily based around their powers, and not weapons like their parents. They are still capable of using weapons very well, but in most scenarios don't due to space, a light person and manuevurability.</p>
                                    <p>You can become either of the twins as a single origin, they fight extremely well together and have 2 whole power sets, using abilities to heal themselves and ignite their enemies into flames, and for when needed they can 
                                        change their healing into a decaying virus that applies many toxins and debuffs as possible!</p>
                                    </div>

                                <div class="sub-panel" data-sub="snow">
                                    <h2>Snow - The Fragmented</h2>
                                    <p>Snow is indeed a Voidwalker, but she was nearly killed when born by the original Nightmare Strain. She obviously survived but it destroyed her powers to the point that even though she is 16 in lore when she meets Veyron, 
                                        she can barely conjure her powers to fight him when she thought he was going to kill her.<p>
                                    <p>She possesses the powers of the cold winds of Syct' Vean and can summon snow storms and any ice-based magic, also letting her do small heals to nearby allies, but not as powerful.<p>
                                    <p>She is proficient in magic just like the twins, so she doesn't have any weapon uniques but can become much more powerful by leveling and casting self-buffs towards herself.</p>
                                    </div>

                                <div class="sub-panel" data-sub="lily">
                                    <h2>Lily - The Deity's Blessed</h2>
                                    <p>Another being blessed by The Deity of Nature, she has the abilities to conjure healing magic wherever she goes and can also manipulate the nearby plant life to fend off against her enemies.<p>
                                    <p>Being a magic user, she has the unique passive of having 2 power sets.</p>
                                    </div>
                    </div>

                    <div class="sub-panel" data-sub="old-legends">
                        <h2>The Old Legends</h2>
                        <p>Legends of the old times, where peace was appreciated, and now it's a luxury. The amount of how many Old Legends there were is unknown, but we know of 3 that are currently alive from this faction.</p>
                        <p>This faction consists of The Deity of Nature, Catastrophe and Zealot. This was a faction of Deities and Gods, but they are now either lost to time, corrupted or dead.</p>
                        <p>After Void had tried to discover the old ruins, all three of them appeared within holograms, but it was their past selves, fragments long forgotten, and one of them was an old friend that Void knew
                            very personally.</p>
                            
                            <div class="sub-tabs">
                                <button class="sub-tab-button active" data-sub="nature-deity">The Deity of Nature</button>
                                <button class="sub-tab-button" data-sub="catastrophe">Catastrophe</button>
                                <button class="sub-tab-button" data-sub="zealot">Zealot</button>
                                </div>

                                <div class="sub-panel active" data-sub="nature-deity">
                                    <h2>The Deity of Nature - The last primordial</h2>
                                    <p>The Deity of Nature was the oldest out of all the legends, being The Voided Gods best friend and being one of very few people whom knew his true name.</p>
                                    <p>The Deity of Nature possesses all the powers of the ones they have blessed and more, capable of performing abilities near the level of Veyron Ashe Vale.</p>
                                    <p>A unique feature is that The Deity of Nature does NOT have an awakening, and only gets more powerful the more plant life is nearby and also the more advancements and levels are completed.</p>
                                    </div>

                                <div class="sub-panel" data-sub="catastrophe">
                                    <h2>Catastrophe - The Reason of it all</h2>
                                    <p>Catastrophe was the reason for the Dragonhearts being released into the omniverse, and the primary reason that Void went insane and was able to kill him one day once and for all.</p>
                                    <p>Catastrophe has many unique passives when inside of the darkness and when it's night, he is also the reason Void has his abilities as he infected him and now Void is a Nightwalker, a Voidwalker x Nightmare abomination. Catastrophe is the only person who knows who Void truly is.</p>
                                    <p>Catastrophe is proficient with magic, but due to his age and immense power, he has over 3 power sets that all have unique use cases and immense power. But due to his already immense power, he does not have an awakening.</p>
                                    </div>
                                
                                <div class="sub-panel" data-sub="zealot">
                                    <h2>Zealot - The Last Lightwalker</h2>
                                    <p>Zealot was the last Lightwalker in existence, being part of a race of corrupted angels that used the light for evil.</p>
                                    <p>Zealot was manipulated and twisted into becoming apart of Catastrophe's team, but once was an old legend whom was not blinded by the immense power that he had amongst people.</p>
                                    <p>Zealot is proficient in huge blades, granting already immensely strong weapons even more power, but instead of damage, he can swing the weapons much faster!</p>
                                    </div>
                    </div>
                `
            },
            {
                id: 'mechanics',
                label: 'Progression and Mechanics',
                title: 'Progression and Mechanics',
                html: `
                    <p>Every origin includes progression layers like custom level systems, ascensions, origin-specific weapons, and special combat proficiencies.</p>
                `
            }



        ];

        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');

        function showEntry(id) {
            document.querySelectorAll('.tab-button').forEach(b =>
                b.classList.toggle('active', b.dataset.id === id));
            document.querySelectorAll('.tab-content').forEach(p =>
                p.classList.toggle('active', p.dataset.id === id));
        }

        entries.forEach((entry) => {
            const btn = document.createElement('button');
            btn.className = 'tab-button';
            btn.textContent = entry.label;
            btn.dataset.id = entry.id;
            btn.addEventListener('click', () => showEntry(entry.id));
            sidebar.appendChild(btn);

            const panel = document.createElement('div');
            panel.className = 'tab-content';
            panel.dataset.id = entry.id;
            panel.innerHTML = `<h2>${entry.title}</h2>${entry.html}`;
            content.appendChild(panel);
        });

        if (entries.length) showEntry(entries[0].id);

        const categories = [
            { cls: 'void-text',        words: ['Veyron', 'Void', 'Voidwalker', 'Void Essence', 'The Voided One', 'Violet'] },
            { cls: 'dragonheart-text', words: ['Dragonheart', 'Florian', 'Wrath', 'wrath', 'Kamila', 'Silas', 'Irina', 'The Twins'] },
            { cls: 'angelic-text',     words: ['Shiori', 'Angel', 'Heaven', 'Heavens', 'Lightwalker', 'Zealot'] },
            { cls: 'demonic-text',     words: ['Varelt', 'Vale', 'Blood', 'Unholy', 'unholy', 'blood', 'Ashe', 'Demon', 'Demonic', 'demonic', 'Death'] },
            { cls: 'nightmare-text',   words: ['Nightmare', 'nightmare', 'Catastrophe', 'catastrophe', 'Benjamin Saiph', 'Decay', 'decay'] },
            { cls: 'nature-text',      words: ['Deity of Nature', 'Nature', 'Natures', 'Siphon'] }
        ];

        content.addEventListener('click', e => {
            const btn = e.target.closest('.sub-tab-button');
            if (!btn) return;

            const bar = btn.parentElement;
            const scope = bar.parentElement;

            bar.querySelectorAll(':scope > .sub-tab-button').forEach(b =>
                b.classList.toggle('active', b === btn));

            scope.querySelectorAll(':scope > .sub-panel').forEach(p =>
                p.classList.toggle('active', p.dataset.sub === btn.dataset.sub));
            });

        const lookup = new Map();
        categories.forEach(c => c.words.forEach(w => lookup.set(w, c.cls)));

        const escapeRegex = s => s.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const words = [...lookup.keys()]
            .sort((a, b) => b.length - a.length)
            .map(escapeRegex);
        const wordRegex = new RegExp(`\\b(${words.join('|')})\\b`, 'g');

        document.querySelectorAll('#sidebar, #content').forEach(root => {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);

            textNodes.forEach(node => {
                const parts = node.nodeValue.split(wordRegex);
                if (parts.length === 1) return;

                const frag = document.createDocumentFragment();
                parts.forEach((part, i) => {
                    if (!part) return;
                    if (i % 2 === 1) {
                        const span = document.createElement('span');
                        span.className = lookup.get(part);
                        span.textContent = part;
                        frag.appendChild(span);
                    } else {
                        frag.appendChild(document.createTextNode(part));
                    }
                });
                node.replaceWith(frag);
            });
        });
    </script>
</body>
</html>
